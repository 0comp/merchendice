# Optional overlay for a fresh server where ports 80 and 443 are free.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_HOSTNAME: ${SITE_HOSTNAME:-merchendice.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
