# Use this location in the existing merchendice.com server block.
# Keep that block's HTTPS certificate settings and other domains intact.
# Access logs must be deleted after 30 days (Privacy Policy). For a plain nginx install, use
# deploy/logrotate-merchendice. Nginx Proxy Manager rotates its own logs inside its container: see DEPLOY.md.
location / {
    proxy_pass http://127.0.0.1:82;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
